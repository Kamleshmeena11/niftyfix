name: "📈 Nifty 1s Bar Collector (Fyers)"
on:
  workflow_dispatch:

# Needed so GITHUB_TOKEN is allowed to push the data backup commits that
# upload_file_to_github() makes inside collector.py. Without this, those
# API calls will 403/404 even though the token is present.
permissions:
  contents: write

jobs:
  collect:
    name: Collect Market Data
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap every job at 360 minutes (6h),
    # regardless of what you set here. 375 was silently truncated/
    # force-cancelled at the cap — hence "The operation was canceled."
    timeout-minutes: 360
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 📦 Install dependencies
        run: pip install -r requirements.txt
      - name: 🚀 Run collector
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_APP_TYPE: ${{ secrets.FYERS_APP_TYPE }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_FY_ID: ${{ secrets.FYERS_FY_ID }}
          FYERS_TOTP_SECRET: ${{ secrets.FYERS_TOTP_SECRET }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_REDIRECT_URI: ${{ secrets.FYERS_REDIRECT_URI }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # NEW: also back the data up to GitHub (commits under data/tcs/
          # in this repo), and use it as the restore fallback whenever
          # Drive isn't configured or has nothing to restore. The default
          # Actions token already has repo write access here because of
          # the top-level `permissions: contents: write` above — no extra
          # secret needs to be created for this.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: how often (seconds) to push a GitHub backup commit.
          # Defaults to 120 in the script if omitted. Raise this if you'd
          # rather have fewer, chunkier commits over a 6h run.
          # GITHUB_SYNC_INTERVAL_SECONDS: "120"
          # NEW: switches the depth source to Fyers' TBT/Versova protobuf
          # feed for real 50-level depth. Set to "standard" (or remove this
          # line) to go back to the original 5-level DepthUpdate feed.
          FYERS_DEPTH_SOURCE: tbt
        run: python collector.py
      - name: 📁 Upload daily + combined CSVs as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-bars-${{ github.run_id }}
          path: |
            data/**/*.csv
            data/*.csv
          retention-days: 30
